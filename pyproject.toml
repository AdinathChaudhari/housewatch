[project]
name = "housewatch"
version = "0.1.0"
description = "Whole-house WAN usage tracker: UPnP IGD polling with wrap/reboot-safe accounting, a menubar app, and a local dashboard."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "rumps>=0.4",
]

[project.scripts]
# Lets `housewatch <cmd>` run from any directory. Without it, `python -m
# housewatch` only works with the project folder as cwd: from any parent
# directory, Python treats the housewatch/ PROJECT folder as a namespace
# package
# and it shadows the real package nested inside it.
housewatch = "housewatch.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["housewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
